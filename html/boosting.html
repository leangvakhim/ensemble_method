<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Boostings</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MathJax Configuration for perfect LaTeX rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false // Triggered manually in JS for smooth transitions
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* Smooth transitions for scaling the weight of points */
        .point {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background-color 0.4s ease;
        }

        /* Smooth fade for the text container when MathJax processes */
        #step-desc-container {
            transition: opacity 0.3s ease-in-out;
        }

        /* Ensure math blocks are responsive and neat */
        .mjx-chtml {
            overflow-x: auto;
            overflow-y: hidden;
            font-size: 100% !important;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans flex items-center justify-center">

    <div class="max-w-4xl w-full mx-auto">
        <!-- Header -->
        <header class="text-center mb-8 fade-in">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-3 tracking-tight">Understanding Boosting</h1>
            <p class="text-slate-500 text-lg max-w-2xl mx-auto">An interactive step-by-step guide to how ensemble methods learn from mistakes.</p>
        </header>

        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden fade-in"
            style="animation-delay: 0.1s;">

            <!-- Step Info Area -->
            <!-- Streamlining layout to accommodate both storytelling and math -->
            <div class="p-6 md:p-10 border-b border-slate-100 bg-white flex flex-col" style="min-height: 24rem;">
                <div class="flex items-center justify-between mb-4">
                    <span id="step-counter"
                        class="bg-indigo-100 text-indigo-800 text-xs md:text-sm font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm">
                        Step 1 of 10
                    </span>
                </div>
                <h2 id="step-title" class="text-2xl md:text-3xl font-bold text-slate-800 mb-4">The Concept: A Committee
                    of Experts</h2>

                <!-- Fade container to hide raw LaTeX while MathJax renders -->
                <div id="step-desc-container"
                    class="text-slate-600 leading-relaxed text-base md:text-lg flex-grow overflow-y-auto pr-2">
                    <div id="step-desc">
                        <!-- Content injected via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Interactive Plot Area -->
            <div class="relative p-6 md:p-8 bg-slate-50">
                <div id="plot-area"
                    class="relative w-full h-[220px] md:h-[280px] border-2 border-slate-200 rounded-2xl overflow-hidden bg-white shadow-inner">

                    <!-- Boundaries injected here -->
                    <div id="boundaries-container" class="absolute inset-0 z-0 transition-opacity duration-500"></div>

                    <!-- Data Points injected here -->
                    <div id="points-container" class="absolute inset-0 z-10 w-full h-full"></div>

                    <!-- X-Axis (Hours Studied) -->
                    <div
                        class="absolute bottom-0 w-full h-12 border-t-2 border-slate-100 bg-slate-50/80 backdrop-blur-sm flex items-center z-0">
                        <div
                            class="absolute left-[15%] transform -translate-x-1/2 text-[10px] md:text-xs font-bold text-slate-400 tracking-wider">
                            1 HR</div>
                        <div
                            class="absolute left-[30%] transform -translate-x-1/2 text-[10px] md:text-xs font-bold text-slate-400 tracking-wider">
                            2 HR</div>
                        <div
                            class="absolute left-[45%] transform -translate-x-1/2 text-[10px] md:text-xs font-bold text-slate-400 tracking-wider">
                            3 HR</div>
                        <div
                            class="absolute left-[60%] transform -translate-x-1/2 text-[10px] md:text-xs font-bold text-slate-400 tracking-wider">
                            4 HR</div>
                        <div
                            class="absolute left-[75%] transform -translate-x-1/2 text-[10px] md:text-xs font-bold text-slate-400 tracking-wider">
                            5 HR</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="p-4 md:p-6 bg-white border-t border-slate-200 flex items-center justify-between rounded-b-3xl">
                <button id="btn-prev"
                    class="px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                    &larr; Prev
                </button>

                <!-- Navigation Dots -->
                <div class="flex flex-wrap justify-center gap-1.5 md:gap-2.5 max-w-[150px] md:max-w-none"
                    id="step-dots"></div>

                <button id="btn-next"
                    class="px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md hover:shadow-lg transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                    Next &rarr;
                </button>
            </div>
        </div>

        <!-- Legend -->
        <p class="text-center text-slate-500 text-sm mt-6 mb-8 font-medium">
            <span class="inline-block w-3 h-3 bg-blue-500 rounded-full mr-1 translate-y-[1px]"></span> Pass (+1)
            &nbsp;&nbsp;&nbsp;
            <span class="inline-block w-3 h-3 bg-orange-500 rounded-full mr-1 translate-y-[1px]"></span> Fail (-1) <br
                class="block md:hidden">
            <span class="inline-block w-4 h-4 border-2 border-red-500 rounded-full translate-y-1 mr-1 md:ml-4"></span>
            Misclassified Error
        </p>
    </div>

    <script src="../js/boosting.js"></script>
</body>

</html>
