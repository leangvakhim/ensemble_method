<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagging (Bootstrap Aggregating) Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom styles for equation formatting */
        .math-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 0.25rem;
        }

        .math-numerator {
            padding: 0 0.2rem;
            font-size: 0.9em;
        }

        .math-denominator {
            border-top: 1px solid #334155;
            padding: 0 0.2rem;
            font-size: 0.9em;
            width: 100%;
            text-align: center;
        }

        .math-sigma {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 0.25rem;
        }

        .math-sigma-symbol {
            font-size: 2.5rem;
            line-height: 0.8;
            font-family: serif;
        }

        .math-limit {
            font-size: 0.75rem;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div
        class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 flex flex-col min-h-[650px]">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">Bagging (Bootstrap Aggregating)</h1>
            <p class="text-indigo-100 mt-2 font-medium">Interactive Step-by-Step Visualization</p>
        </div>

        <!-- Progress Bar -->
        <div class="bg-slate-50 border-b border-gray-100 px-6 py-4 flex justify-between items-center relative">
            <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 z-0 px-10">
                <div id="progress-line" class="h-full bg-indigo-500 transition-all duration-300 w-0"></div>
            </div>

            <!-- Step Dots generated by JS -->
            <div id="progress-dots" class="flex justify-between w-full relative z-10 px-4"></div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow p-6 sm:p-10 flex flex-col justify-center items-center bg-white" id="content-area">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- Controls -->
        <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-between items-center">
            <button id="btn-prev"
                class="px-6 py-2.5 rounded-lg font-medium text-slate-600 bg-white border border-gray-300 hover:bg-gray-50 hover:text-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Back
            </button>
            <div id="step-counter" class="text-slate-500 font-medium">Step 1 of 5</div>
            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Next &rarr;
            </button>
        </div>
    </div>

    <script src="../js/bagging.js"></script>
</body>

</html>
