<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagging Calculations Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div
        class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 flex flex-col min-h-[700px]">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">Bagging (Bootstrap Aggregating)</h1>
            <p class="text-indigo-100 mt-2 font-medium text-sm sm:text-base">Interactive Step-by-Step Math Calculation
            </p>
        </div>

        <!-- Progress Bar -->
        <div class="bg-slate-50 border-b border-gray-100 px-4 sm:px-8 py-5 flex justify-between items-center relative">
            <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 z-0 px-12">
                <div id="progress-line" class="h-full bg-indigo-500 transition-all duration-500 w-0"></div>
            </div>
            <!-- Step Dots generated by JS -->
            <div id="progress-dots" class="flex justify-between w-full relative z-10"></div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow p-6 sm:p-10 flex flex-col justify-center items-center bg-white" id="content-area">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- Controls -->
        <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-between items-center">
            <button id="btn-prev"
                class="px-5 sm:px-6 py-2 sm:py-2.5 rounded-lg font-medium text-slate-600 bg-white border border-gray-300 hover:bg-gray-50 hover:text-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Back
            </button>
            <div id="step-counter" class="text-slate-500 font-medium text-sm sm:text-base">Step 1 of 6</div>
            <button id="btn-next"
                class="px-5 sm:px-6 py-2 sm:py-2.5 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Next &rarr;
            </button>
        </div>
    </div>

    <script src="../js/bagging.js"></script>
</body>

</html>
